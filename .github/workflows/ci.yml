name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: lint · types · test · layering
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Pin Python
        run: uv python install

      - name: Sync workspace
        run: uv sync --all-packages

      - name: Lint (ruff)
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Types (mypy --strict)
        run: |
          uv run mypy --config-file mypy.ini \
            packages/attestor-core/src \
            packages/attestor-platform/src \
            packages/attestor-fleet/src \
            services/control-plane/src \
            services/dispatcher/src \
            tools

      - name: Test (pytest)
        run: uv run pytest

      - name: Layering invariant
        run: uv run python tools/check_layering.py
