[project]
name = "control-plane"
version = "0.1.0"
description = "Attestor control plane -- FastAPI on Cloud Run. Composition root, no domain logic."
requires-python = ">=3.12,<3.13"
dependencies = [
    "attestor-core",
    "attestor-platform",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "google-cloud-firestore>=2.19",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/control_plane"]
