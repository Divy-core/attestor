[project]
name = "runtime"
version = "0.1.0"
description = "Attestor Agent Runtime bundle -- AdkApp wrapper + agent_engines.create() deploy script."
requires-python = ">=3.12,<3.13"
dependencies = [
    "google-adk",
    "google-genai",
    "google-cloud-aiplatform[agent-engines]",
]
# Deliberately NOT depending on attestor-fleet in Phase 0. Section 6 deploys the smallest
# possible real agent; the fleet is wired in at Phase 5. Keeping the deployment
# requirements list minimal is an explicit Phase 0 requirement.

[tool.uv]
package = false
