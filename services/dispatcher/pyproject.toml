[project]
name = "dispatcher"
version = "0.1.0"
description = "Attestor dispatcher -- Eventarc/Pub-Sub push subscriber on Cloud Run. Idempotent resume."
requires-python = ">=3.12,<3.13"
dependencies = [
    "attestor-core",
    "attestor-platform",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dispatcher"]
