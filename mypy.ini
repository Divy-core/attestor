[mypy]
python_version = 3.12
strict = True
warn_unused_configs = True
warn_redundant_casts = True
warn_unused_ignores = True
disallow_any_generics = True
disallow_untyped_defs = True
no_implicit_reexport = True
namespace_packages = True
explicit_package_bases = True
mypy_path =
    packages/attestor-core/src,
    packages/attestor-platform/src,
    packages/attestor-fleet/src,
    services/control-plane/src,
    services/dispatcher/src,
    tools

[mypy-tests.*]
disallow_untyped_defs = False

# Google SDKs ship incomplete stubs; do not let that block --strict on our code.
[mypy-google.*]
ignore_missing_imports = True

[mypy-vertexai.*]
ignore_missing_imports = True

[mypy-agentplatform.*]
ignore_missing_imports = True

# services/runtime is the Agent Runtime bundle root: runtime_app.py and deploy.py sit at
# its top level (no src/ layout) because that directory is what gets packaged and shipped.
# The module must NOT be called `app` -- that name collides with the platform's own
# /code/app package inside the runtime container.
[mypy-runtime_app]
ignore_missing_imports = True
