target-version = "py312"
line-length = 100

# Prose, not source. ruff formats fenced Python blocks inside Markdown, which would
# rewrite the illustrative snippets in the discovery and gate docs -- including the
# ones deliberately quoting the *wrong* API shape we found.
extend-exclude = ["docs", "attestor.old", "seed", "evals"]
src = [
    "packages/attestor-core/src",
    "packages/attestor-platform/src",
    "packages/attestor-fleet/src",
    "services/control-plane/src",
    "services/dispatcher/src",
    "services/runtime",
    "tools",
    "tests",
]

[lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # bugbear
    "UP",   # pyupgrade
    "N",    # pep8-naming
    "ANN",  # annotations
    "S",    # bandit
    "C4",   # comprehensions
    "SIM",  # simplify
    "TID",  # tidy imports
    "RUF",
]
ignore = [
    "ANN401",  # allow Any where genuinely needed
    # Domain errors read better without the suffix: `IllegalTransition`,
    # `EvidenceMissing`, `ArmorBlocked` are the vocabulary of the problem domain, and
    # `EvidenceMissingError` adds nothing. They all subclass AttestorError, which does
    # carry the suffix, so the hierarchy is still obvious.
    "N818",
]

[lint.per-file-ignores]
"tests/**" = ["S101", "ANN"]      # asserts and loose typing are fine in tests
"tools/**" = ["S603", "S607"]
# S310 warns that urlopen could be handed a file: or custom scheme. In both adapters the
# host is an https constant built from config (the Model Armor regional endpoint and the
# Agent Registry host); no user-supplied URL reaches either call. Both use urllib rather
# than requests deliberately -- attestor-platform is imported by the Agent Runtime bundle
# and every avoidable dependency there is a way for the deploy to fail.
"packages/attestor-platform/src/attestor_platform/armor/client.py" = ["S310"]
"packages/attestor-platform/src/attestor_platform/registry/agent_registry.py" = ["S310"]
# Same reasoning: a fixed https host (firebaserules.googleapis.com) built from a constant.
"infra/firestore/deploy_rules.py" = ["S310"]

[format]
quote-style = "double"
