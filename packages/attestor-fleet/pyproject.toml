[project]
name = "attestor-fleet"
version = "0.1.0"
description = "The ADK agents. Bundled to Agent Runtime. Minimal deps -- no web framework, ever."
requires-python = ">=3.12,<3.13"
dependencies = [
    "attestor-core",
    "attestor-platform",
    "google-adk",
]

# INVARIANT: this package is shipped to Agent Runtime as a bundle. It must never
# depend on fastapi, uvicorn, or any service. tools/check_layering.py enforces it.

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/attestor_fleet"]
