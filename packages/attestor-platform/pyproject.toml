[project]
name = "attestor-platform"
version = "0.1.0"
description = "Every Google Cloud edge behind one boundary: Firestore, GCS, Model Armor, Search, Registry, Pub/Sub, telemetry."
requires-python = ">=3.12,<3.13"
dependencies = [
    "attestor-core",
    "google-auth>=2.56.3",
    "google-cloud-discoveryengine>=0.20.2",
    "google-cloud-firestore>=2.28.1",
    "google-cloud-pubsub>=2.39.1",
    "google-cloud-storage>=3.13.1",
    "openpyxl>=3.1.5",
    "opentelemetry-api>=1.43.0",
    "opentelemetry-sdk>=1.43.0",
    "pydantic>=2.9",
    "pydantic-settings>=2.4",
    "reportlab>=4.2",
]
# GCP client libraries are added in Phase 2, against the service names verified in
# docs/proof/PHASE-0-DISCOVERY.md. Phase 0 deliberately does not add them speculatively.

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/attestor_platform"]
