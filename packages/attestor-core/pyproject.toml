[project]
name = "attestor-core"
version = "0.1.0"
description = "Attestor domain model, review state machine, and deny/ask/allow policy. Pure Python."
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/attestor_core"]
